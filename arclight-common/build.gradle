plugins {
    id 'architectury-plugin'
}

architectury {
    common(rootProject.ext.supportedPlatforms)
}

loom {
    accessWidenerPath = file('src/main/resources/arclight.accesswidener')
}

dependencies {
    modImplementation libs.fabric.loader

    compileOnly rootProject.ext.generatedSpigot

    // neoforge 平台专用：@Overwrite checkTotemDeathProtection 保留 removeEffectsCuredBy 调用点需引用 EffectCures
    compileOnly "net.neoforged:neoforge:${libs.versions.neoforge.get()}:universal"

    // 编译期引用 Create 的 SmartBlockEntity（首次 tick 主线程化 mixin 的 target 校验；
    // 运行期不依赖，mixin 用 @LoadIfMod 条件加载）
    compileOnly files('libs/create-1.21.1-6.0.10.jar')

    // create jar-in-jar deps (VirtualBlockEntity etc. in ponder)
    compileOnly files('libs/ponder-neoforge-1.0.82+mc1.21.1.jar')

    // 编译期引用 Sable 的 VoxelNeighborhoodState（并发 map 加锁兼容 mixin 的 target 校验；
    // 运行期不依赖，mixin 用 @LoadIfMod 条件加载）
    compileOnly files('libs/sable-neoforge-1.21.1-2.0.3.jar')

    // 编译期引用 MineColonies 市民基类（相位错峰 mixin 的 target 校验；运行期不依赖）
    compileOnly files('libs/minecolonies-1.1.1294-1.21.1-snapshot.jar')

    // 编译期引用 unlockable_recipes 登录配方同步（进服时向全体广播配方包导致 JEI
    // 全量重建冻结客户端；mixin 改为只发进服者。运行期不依赖，@LoadIfMod 条件加载）
    compileOnly files('libs/unlockable_recipes-0.1.1.jar')
    // PlayerLoggedInEvent 超类 Event 在 neoforge-bus 里，universal 包不内嵌 bus 类
    compileOnly files('libs/bus-8.0.5.jar')
    // 编译期引用 SuperbWarfare（S2.11 弹道/粒子/广播适配 mixin 的 target 校验；
    // 运行期不依赖，mixin 用 @LoadIfMod 条件加载，无 SBW 时零影响）
    compileOnly files('libs/superbwarfare-0.8.10-snapshot-mc1.21.1.jar')

    implementation libs.izzel.tools
    implementation libs.arclight.api
    implementation libs.mixin.tools
    annotationProcessor(libs.mixin.tools) { transitive = false }

    // adventure (移植自 1.20.1 服务端自带命令的 adventure 支持)
    implementation libs.adventure.api
    implementation libs.adventure.serializer.gson
    implementation libs.adventure.serializer.legacy
    implementation libs.adventure.serializer.plain
    implementation libs.adventure.text.minimessage

    // spigot
    implementation libs.spigot.api
    implementation libs.jline
    implementation libs.terminalconsoleappender
    implementation libs.specialsource
    implementation libs.log4j.jul
    implementation libs.bungeecord.chat
    implementation libs.mysql.connectorj
    implementation libs.snakeyaml

    implementation project(':i18n-config')
}

compileJava {
    options.compilerArgs << '-XDignore.symbol.file' << '-XDenableSunApiLintControl'
    options.encoding = 'UTF-8'
}
