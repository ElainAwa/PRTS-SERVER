import io.izzel.arclight.gradle.tasks.UploadFilesTask

allprojects {
    group 'io.izzel.luminara'
    version '1.0.65'

    def getGitHash = { ->
        def stdout = new ByteArrayOutputStream()
        try {
            exec {
                commandLine 'git', 'rev-parse', '--short', 'HEAD'
                standardOutput = stdout
            }
        } catch (Exception ignored) {
            // Return a default value if git command fails
            return "test"
        }
        def hash = stdout.toString().trim()
        // 工作树有未提交改动时追加内容指纹, 重建 jar 的版本串随之变化, 部署缓存自动失效
        try {
            def statusOut = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'status', '--porcelain'
                standardOutput = statusOut
            }
            // 仅 tracked 文件改动计入指纹, untracked 噪音(构建日志等)不触发版本变化
            if (statusOut.toString().readLines().any { !it.startsWith('??') }) {
                def dirtyOut = new ByteArrayOutputStream()
                exec {
                    commandLine 'git', 'stash', 'create'
                    standardOutput = dirtyOut
                }
                def dirty = dirtyOut.toString().trim()
                // stash commit 含时间戳不具确定性, 取其 tree 快照(纯内容寻址)作指纹
                if (!dirty.isEmpty()) {
                    def treeOut = new ByteArrayOutputStream()
                    exec {
                        commandLine 'git', 'rev-parse', "${dirty}^{tree}"
                        standardOutput = treeOut
                    }
                    def tree = treeOut.toString().trim()
                    hash += '-' + tree.take(12)
                }
            }
        } catch (Exception ignored) {
            // 指纹计算失败时保持原行为, 仅以 HEAD hash 为版本串
        }
        return hash
    }

    ext {
        agpVersion = '1.23'
        minecraftVersion = '1.20.1'
        forgeVersion = '47.4.16'
        apiVersion = '1.5.4'
        toolsVersion = '1.3.0'
        mixinVersion = project.ext.mixinVersion
        versionName = 'trials'
        gitHash = getGitHash()
    }

    task cleanBuild {
        doFirst {
            project.file("build/libs").deleteDir()
        }
    }
}

task collect(type: Copy) {
    destinationDir = file('build/libs')
    from { project(':arclight-forge').tasks.jar.outputs }
    dependsOn { project(':arclight-forge').tasks.jar }
}

def gitBranch() {
    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
            standardOutput = stdout
        }
    } catch (Exception ignored) {
        return "unknown"
    }
    return stdout.toString().trim()
}

tasks.register('uploadFiles', UploadFilesTask) {
    mcVersion.set project.ext.minecraftVersion
    version.set "${project.version}-${project.ext.gitHash}"
    snapshot.set project.version.toString().endsWith("-SNAPSHOT")
    gitHash.set project.ext.gitHash
    branch.set gitBranch()
    inputs.files tasks.collect.outputs.files
    dependsOn(tasks.collect)
}
